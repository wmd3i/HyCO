# Data and shared model parameters
data:
  # Raw test data; both RL and DM use the `locs` in this file
  test_path: "../data/tsp_solutions_test10000_n500_s7991_solver_concorde.npz"  # test set

# prefix_k: 1 # length of the RL-generated prefix

model: # DM architecture parameters
  num_nodes: 500
  node_coord_dim: 2
  pos_embed_num_feats: 64
  node_embed_dim: 128
  prefix_enc_hidden_dim: 256
  prefix_cond_dim: 256
  gnn_n_layers: 12
  gnn_hidden_dim: 256
  gnn_aggregation: "sum"
  gnn_norm: "layer"
  gnn_learn_norm: true
  gnn_gated: true
  time_embed_dim: 256

# RL model
rl_model:
  name: LEHD  # use the LEHD model
  problem: 'tsp'
  # Path to the LEHD checkpoint (e.g., result/20230509_153705_train/checkpoint-150.pt)
  ckpt_path: "./checkpoints/checkpoint-150.pt"
  # Additional LEHD parameters (must match those used in TSPModel.py)
  lehd_params:
    embedding_dim: 128
    sqrt_embedding_dim: 11.3137 # 128 ** 0.5
    decoder_layer_num: 6
    qkv_dim: 16
    head_num: 8
    ff_hidden_dim: 512

# Diffusion model
dm_model:
  ckpt_path: "../checkpoints/prefix_difusco/tsp500/stage1_k0_20_epoch_20.pth"
diffusion: # DM diffusion process parameters
  num_timesteps: 1000
  schedule_type: 'cosine'

# Evaluation
eval:
  batch_size: 1 # must fit both the RL and the DM model in GPU memory
  num_inference_steps: 20
  inference_schedule_type: 'polynomial'
  apply_two_opt: False
  num_samples_to_visualize: 5 # number of instances for which comparison plots are generated
  two_opt_max_iterations: 50

solver:
  # --- Whether to enable the theory-driven trigger ---
  use_theory_trigger: True

  # --- Probe parameters ---
  # Number of RL top-M candidate actions to probe
  probe_rl_top_m: 15
  # Fixed noise level used by the DM probe (total steps T=1000)
  dm_probe_timestep: 500
  # Temperature of the DM prior distribution (controls the sharpness of the softmax)
  dm_prior_temp: 0.1
# --- Additional parameters ---
  # Cumulative probability threshold for adaptive candidate selection
  # Recommended: 0.9 or 0.95
  adaptive_m_p_thresh: 0.5
  # --- Trigger thresholds ---
  entropy_threshold: 1.2
  kl_div_threshold: 30

  # --- Other parameters ---
  dm_inference_steps: 30
  dynamic_n_cumulative_threshold: 0.9
  apply_two_opt: False
