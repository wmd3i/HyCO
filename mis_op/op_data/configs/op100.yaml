# Config for OP-100 data generation (generate_op_dataset_rl.py) and the Gurobi reference solver (gurobi_op.py).
# Run the scripts from mis_op/op_data/.

rl_model:
  name: "AttentionModel"
  problem: 'op'
  ckpt_path: "../checkpoints/rl_op/op100_epoch098"   # pretrained rl4co AttentionModel for OP-100

data:
  test_path: "../data/op/op100/test.txt"   # used by gurobi_op.py

model:
  num_nodes: 101        # depot + 100 customers
  sparse_factor: 50    # k-NN sparsity used when loading the dataset

solver:
  gurobi_time_limit: 300   # seconds per instance (Gurobi-300 in the paper; use 30 for Gurobi-30)
